<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>諸天萬界｜試閱版</title>
<style>body{margin:0;background:#f6f3ec;color:#252525;font-family:system-ui,"Noto Serif TC",serif}header{background:#172b35;color:white;padding:18px max(20px,calc((100vw - 860px)/2))}h1{font-size:24px;margin:0 0 8px}header p{margin:0;color:#d5e0e4;font-size:13px}.bar{max-width:860px;margin:18px auto;padding:0 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,select{padding:10px 14px;border:1px solid #b8c0c3;border-radius:7px;background:white;font-size:15px}button{cursor:pointer}main{box-sizing:border-box;max-width:860px;margin:0 auto 50px;padding:30px clamp(20px,5vw,65px);background:#fff;box-shadow:0 2px 20px #0000000c;min-height:60vh}article{font-size:19px;line-height:2.05;letter-spacing:.04em}article p{text-indent:2em;margin:0 0 1.1em}h2{text-align:center;font-size:25px;line-height:1.5;margin:0 0 30px}#status{font-size:14px;color:#555}footer{text-align:center;padding:20px;color:#777;font-size:13px}@media(max-width:600px){article{font-size:18px}main{padding:26px 20px}}</style></head>
<body><header><h1>諸天萬界</h1><p>新版小說・作者試閱｜未經最終校訂，內容可能調整</p></header><div class="bar"><button id="prev">上一章</button><select id="chap" aria-label="選擇章節"></select><button id="next">下一章</button><span id="status"></span></div><main><article id="story"></article></main><footer>本頁為獨立試閱，不取代正式小說目錄。</footer>
<script>
const ref='draft/novel-v2-ch091-20261114', max=173, select=document.getElementById('chap'),story=document.getElementById('story'),status=document.getElementById('status');
for(let i=1;i<=max;i++){let o=document.createElement('option');o.value=i;o.textContent='第 '+i+' 章';select.append(o)}
function render(md){const lines=md.replace(/\r/g,'').split('\n');story.replaceChildren();let title=lines.find(x=>/^##?\s*第.{1,12}章/.test(x))||lines.find(x=>/^#\s*第/.test(x))||'';
if(title){let h=document.createElement('h2');h.textContent=title.replace(/^#+\s*/,'');story.append(h)}
for(const l of lines){let s=l.trim();if(!s||s.startsWith('#')||s.startsWith('<!--'))continue;let p=document.createElement('p');p.textContent=s;story.append(p)}}
async function load(n){n=Math.max(1,Math.min(max,n));select.value=n;history.replaceState(null,'','#chapter-'+n);status.textContent='讀取中…';story.textContent='';try{let path='drafts/zhu-tian-wan-jie/v2/chapter-'+String(n).padStart(3,'0')+'.md';let url='https://raw.githubusercontent.com/LarryYen0617/larry-law-study/'+encodeURIComponent(ref)+'/'+path;let r=await fetch(url);if(!r.ok)throw Error('HTTP '+r.status);render(await r.text());status.textContent='草稿試閱 · 第 '+n+' / '+max+' 章';window.scrollTo(0,0)}catch(e){status.textContent='讀取失敗';story.textContent='無法載入本章，請稍後重試。('+e.message+')'}}
select.onchange=()=>load(+select.value);document.getElementById('prev').onclick=()=>load(+select.value-1);document.getElementById('next').onclick=()=>load(+select.value+1);load(+(location.hash.match(/chapter-(\d+)/)||[])[1]||1);
</script></body></html>
