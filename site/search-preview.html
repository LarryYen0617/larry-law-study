<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#162b47">
<title>全站教材搜尋｜法域中樞 LEX NEXUS</title>
<link rel="stylesheet" href="design-system.css">
<style>
:root{color-scheme:light dark}
body{font-family:system-ui,"Noto Sans TC",sans-serif;max-width:980px;margin:0 auto;padding:clamp(1rem,3vw,2rem);line-height:1.65}
main{min-width:0}h1{font-size:clamp(1.5rem,4vw,2.3rem)}
.search-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:.75rem;align-items:end}
label{display:block;font-weight:600}input,select{width:100%;box-sizing:border-box;padding:.75rem;font:inherit;border:1px solid #888;border-radius:.55rem;min-height:2.8rem;background:Canvas;color:CanvasText}
button{min-height:44px;min-width:44px;font:inherit;padding:.5rem .9rem;border:1px solid #888;border-radius:.5rem;background:Canvas;color:CanvasText;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
article{border:1px solid #8886;border-radius:.75rem;padding:1rem;margin:.8rem 0;overflow-wrap:anywhere}
article h2{font-size:1.1rem;margin:0 0 .25rem}article p{margin:.5rem 0 0;white-space:normal}
.meta{font-size:.87rem;opacity:.82}
#status{min-height:1.6rem;color:var(--ink);font-size:1rem}#pager{display:flex;flex-wrap:wrap;gap:1rem;align-items:center;justify-content:center;margin:1rem 0}
#page-jump{width:5rem;max-width:100%;min-height:44px}#pager label{display:inline-flex;align-items:center;gap:.35rem}a{overflow-wrap:anywhere}h2:focus-visible,a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #2c8bd8;outline-offset:2px}
@media(max-width:700px){.search-grid{grid-template-columns:1fr}.search-grid label{width:100%}article{padding:.85rem}}
</style>
<link rel="stylesheet" href="experience.css?v=20261029-structure"></head>
<body>
<main>
<nav aria-label="返回"><a href="courses.html">← 返回課程與筆記</a> · <a href="discover.html">原有搜尋與複習</a></nav>
<h1>全站教材搜尋</h1>
<p>查詢公開筆記、題目、自編案例、閱讀及小說索引；教師限制閱覽原題不列入公開搜尋。實際資料筆數顯示於下方載入狀態，查詢只在本機瀏覽器進行。</p>
<div class="search-grid" role="search" aria-label="教材搜尋條件">
<label for="query">關鍵字<input id="query" type="search" maxlength="200" aria-describedby="search-help" aria-controls="results" placeholder="例如：物權 757、強盜、法學英文" autocomplete="off"></label>
<label for="subject">科目<select id="subject"><option value="">全部科目</option></select></label>
<label for="kind">資料類型<select id="kind"><option value="">全部類型</option></select></label>
</div>
<p id="search-help">可輸入多個關鍵字，以空白分隔；結果須同時符合所有關鍵字。法條可查「第757條」、「§757」、「民法第757條」，以及「759條」、「民法759」、「民法759條」等基本條文簡寫，及「第759之1條」、「第759條之1」、「§759-1」、「759-1」等增訂條文（可搜尋筆記中的簡寫）。最多輸入 200 個字元。</p>
<button id="reset" type="button" hidden>清除搜尋與篩選條件</button>
<p id="status" role="status" aria-live="polite">正在讀取教材資料庫……</p>
<button id="retry" type="button" hidden>重新載入</button>
<section id="results" aria-label="搜尋結果" aria-busy="true"></section>
<div id="pager" hidden><button id="previous" type="button">上一頁</button><span id="page-label" aria-live="polite" aria-atomic="true"></span><button id="next" type="button">下一頁</button><label for="page-jump">跳至頁碼</label><input id="page-jump" type="number" min="1" step="1" inputmode="numeric" aria-describedby="page-label"><button id="go-page" type="button">前往</button></div>
</main>
<script type="module">
const $=selector=>document.querySelector(selector);
const input=$("#query"),subject=$("#subject"),kind=$("#kind"),status=$("#status"),results=$("#results"),pager=$("#pager");
const subjectNames={criminalgeneral:"刑法總則",civilgeneral:"民法總則",constitution:"憲法",crime:"刑法分則",family:"親屬法",debt:"債權",property:"物權",admin:"行政法",tax:"租稅法",legalenglish:"法學英文",photonics:"光電科技","繼承法":"繼承法","":"小說／未分類"};
const kindNames={note:"筆記",card:"重點卡片",question:"題目",teacher:"自編案例",archive:"資料庫",reading:"閱讀",lesson:"申論練習",novel:"小說"};
// Canonicalize Taiwan's inserted article numbers before matching (e.g. §759-1).
const normalizeCitations=value=>String(value||"").normalize("NFKC")
  .replace(/第\s*(\d+)\s*-\s*(\d+)\s*條/g,"第$1條之$2")
  .replace(/第\s*(\d+)\s*之\s*(\d+)\s*條/g,"第$1條之$2")
  .replace(/第\s*(\d+)\s*條\s*-\s*(\d+)/g,"第$1條之$2")
  .replace(/第\s*(\d+)\s*條\s*之\s*(\d+)/g,"第$1條之$2")
  .replace(/第\s*(\d+)\s*條/g,"第$1條")
  .replace(/§\s*(\d+)\s*(?:-\s*(\d+)|之\s*(\d+))/g,(_,number,a,b)=>"§"+number+"-"+(a||b))
  .replace(/§\s*(\d+)/g,"§$1")
  // Index text may cite bare 759之1、759條之1 or 759之1條.
  // Keep 第... citations and longer suffixed references exact.
  .replace(/(^|[^第\d條之])(\d{1,4})(?:條之|之)(\d{1,3})條?(?![\d之-])/g,(_,prefix,number,suffix)=>prefix+number+"-"+suffix)
  .replace(/\s+/g," ").trim();
const normalize=value=>normalizeCitations(value).toLocaleLowerCase("zh-TW");
const label=(table,key)=>table[key]||key||"未分類";
// AND between words; OR between a course abbreviation and its full name.
const aliases={刑總:"刑法總則",民總:"民法總則",債總:"債權",刑分:"刑法分則",法英:"法學英文"};
const queryGroups=value=>normalize(value).split(" ").filter(Boolean).flatMap(token=>{
  // Treat "民法第757條" as an AND query for the law and its article,
  // while keeping "第757條" and "§757" equivalent spellings.
  const compound=token.match(/^(.+?)(第\d+條(?:之\d+)?|§\d+(?:-\d+)?)$/)
    // A bare inserted citation attached to a law name must still match
    // the canonical "第...條之..." spelling (e.g. 民法759-1).
    ||token.match(/^(.+?法)(\d{1,4}(?:-|條之|之)\d{1,3})$/)
    ||token.match(/^(.+?法)(\d{1,4}條)$/)
    ||token.match(/^(.+?法)(\d{1,4})$/);
  // Law-name-attached bare numbers denote articles; unrelated bare numbers stay free text.
  const parts=compound?[compound[1],/^\d{1,4}$/.test(compound[2])?compound[2]+"條":compound[2]]:[token];
  return parts.map(term=>{
    // Bare inserted article numbers are common in student notes: "759-1",
    // "759之1" and "759條之1" should resolve to the exact cited article.
    // Keep ordinary bare numbers as free-text terms (years, page numbers).
    const bareBase=term.match(/^(\d{1,4})條$/);
    if(bareBase)return ["第"+bareBase[1]+"條","§"+bareBase[1],bareBase[1]+"條"];
    const bareInserted=term.match(/^(\d{1,4})(?:-|條之|之)(\d{1,3})$/);
    if(bareInserted)return ["第"+bareInserted[1]+"條之"+bareInserted[2],"§"+bareInserted[1]+"-"+bareInserted[2],bareInserted[1]+"-"+bareInserted[2]];
    const article=term.match(/^(?:第(\d+)條(?:之(\d+))?|§(\d+)(?:-(\d+))?)$/);
    if(article){
      const number=article[1]||article[3],suffix=article[2]||article[4];
      return suffix?["第"+number+"條之"+suffix,"§"+number+"-"+suffix,number+"-"+suffix]:["第"+number+"條","§"+number,number+"條"];
    }
    return aliases[term]?[term,aliases[term]]:[term];
  });
});
// Article references must match whole article numbers: §759 is not §759-1,
// and 第759條之1 is not 第759條之10. Other keywords retain substring search.
function termIndex(text,term){
  const named=term.match(/^第(\d+)條(?:之(\d+))?$/);
  if(named){
    const pattern="第"+named[1]+"條"+(named[2]?"之"+named[2]+"(?![\\d-])":"(?!之\\d)");
    return text.search(new RegExp(pattern));
  }
  const section=term.match(/^§(\d+)(?:-(\d+))?$/);
  if(section){
    const pattern="§"+section[1]+(section[2]?"-"+section[2]+"(?![\\d-])":"(?![-\\d])");
    return text.search(new RegExp(pattern));
  }
  const bareBase=term.match(/^(\d{1,4})條$/);
  if(bareBase)return text.search(new RegExp("(?:^|[^\\d])"+bareBase[1]+"條(?!之\\d)"));
  const bare=term.match(/^(\d+)-(\d+)$/);
  if(bare)return text.search(new RegExp("(?:^|[^\\d-])"+bare[1]+"-"+bare[2]+"(?![\\d-])"));
  return text.indexOf(term);
}
// Empty subject is a real indexed category (novel/uncategorized), not "all".
const uncategorizedSubject="__uncategorized__";
const pageSize=20;
let records=[],hits=[],page=0,timer,ready=false;
let loadSequence=0,activeLoadController=null;
// Preserve edits made before the initial fetch or a retry finishes.
let pendingUserEdits=false;
function safeHref(href){
  // Match the primary search's explicit public-page allowlist. A same-origin
  // absolute URL (including userinfo) or arbitrary local HTML is not trusted.
  if(typeof href!=="string"||!/^(?:essentials|library|index|reading|legal-english|photonics|courses|class-notes\/[a-z0-9-]+)\.html(?:[?#]|$)/.test(href))return null;
  if(href.includes("\\")||/[\u0000-\u001f\u007f]/.test(href))return null;
  try{
    const target=new URL(href,location.href),base=new URL(".",location.href);
    if(target.origin!==base.origin||!target.pathname.startsWith(base.pathname)||target.username||target.password)return null;
    return href;
  }catch{return null;}
}
function updateLink(){
  const params=new URLSearchParams();
  if(input.value.trim())params.set("q",input.value.trim().slice(0,200));
  if(subject.value)params.set("subject",subject.value);
  if(kind.value)params.set("type",kind.value);
  if(page>0)params.set("page",String(page+1));
  const query=params.toString();
  history.replaceState(null,"",location.pathname+(query?"?"+query:""));
}
function pageFromUrl(params){
  const value=params.get("page");
  return value&&/^[1-9]\d{0,3}$/.test(value)?Number(value)-1:0;
}
function fillOptions(element,values,labels){
  for(const key of [...values].sort((a,b)=>label(labels,a).localeCompare(label(labels,b),"zh-TW"))){
    const option=document.createElement("option");
    option.value=key;option.textContent=label(labels,key);element.append(option);
  }
}
function snippet(record,terms){
  // Normalize display text before computing offsets: NFKC and whitespace
  // collapsing change character positions in the original body.
  const body=normalizeCitations(record.body);
  if(!body)return "";
  const normalized=body.toLocaleLowerCase("zh-TW");
  // A query term may match only the title/subject; use the first term
  // actually present in the body so the excerpt shows a real body match.
  let position=-1;
  for(const variants of terms){
    for(const term of variants){
      position=termIndex(normalized,term);
      if(position>=0)break;
    }
    if(position>=0)break;
  }
  if(position<0)position=0;
  const start=Math.max(0,position-65),end=Math.min(body.length,start+220);
  return (start?"…":"")+body.slice(start,end)+(end<body.length?"…":"");
}
function draw(){
  results.replaceChildren();
  if(!hits.length){
    const empty=document.createElement("p");
    empty.className="meta";
    empty.textContent="找不到符合條件的教材。請縮短關鍵字或清除篩選條件。";
    results.append(empty);
  }
  $("#reset").hidden=!input.value.trim()&&!subject.value&&!kind.value;
  const totalPages=Math.max(1,Math.ceil(hits.length/pageSize));
  page=Math.min(page,totalPages-1);
  const terms=queryGroups(input.value);
  const start=page*pageSize;
  for(const item of hits.slice(start,start+pageSize)){
    const article=document.createElement("article");
    const heading=document.createElement("h2");heading.tabIndex=-1;
    const link=document.createElement("a");
    link.href=item.href;link.textContent=item.title;
    heading.append(link);
    const meta=document.createElement("div");meta.className="meta";
    meta.textContent=label(subjectNames,item.subject)+" · "+label(kindNames,item.type);
    const detail=document.createElement("p");detail.textContent=snippet(item,terms);
    article.append(heading,meta,detail);results.append(article);
  }
  status.textContent=records.length+" 筆資料已載入；"+(terms.length?"找到 ":"目前顯示 ")+hits.length+" 筆"+(hits.length?"，目前顯示第 "+(start+1)+"–"+Math.min(start+pageSize,hits.length)+" 筆，每頁 "+pageSize+" 筆。":"。");
  pager.hidden=hits.length<=pageSize;
  $("#page-label").textContent="第 "+(page+1)+"／"+totalPages+" 頁";
  $("#previous").disabled=page===0;$("#next").disabled=page>=totalPages-1;
  $("#page-jump").max=String(totalPages);$("#page-jump").value=String(page+1);
}
function search(options={}){
  const preservePage=options?.preservePage===true;
  clearTimeout(timer);
  if(!ready)return;
  const terms=queryGroups(input.value.slice(0,200));
  const selectedSubject=subject.value,selectedKind=kind.value;
  const matchesFilters=item=>(!selectedSubject||item.subject===(selectedSubject===uncategorizedSubject?"":selectedSubject))&&(!selectedKind||item.type===selectedKind);
  if(!terms.length){
    hits=records.filter(matchesFilters);
    if(!preservePage)page=0;draw();updateLink();return;
  }
  hits=records.filter(matchesFilters).map(item=>{
    if(!terms.length)return {item,score:0};
    let score=0;
    for(const variants of terms){
      const inTitle=variants.some(term=>termIndex(item._title,term)>=0),inSubject=variants.some(term=>termIndex(item._subject,term)>=0),inBody=variants.some(term=>termIndex(item._body,term)>=0);
      if(!inTitle&&!inSubject&&!inBody)return null;
      score+=(inTitle?9:0)+(inSubject?4:0)+(inBody?1:0);
    }
    return {item,score};
  }).filter(Boolean).sort((a,b)=>b.score-a.score||a.item.title.localeCompare(b.item.title,"zh-TW")).map(x=>x.item);
  if(!preservePage)page=0;draw();updateLink();
}
// Bound the response *before* JSON parsing. A forged Content-Length or
// chunked response must not exhaust memory on low-RAM mobile devices.
async function readBoundedIndex(response){
  const maxBytes=16*1024*1024; // The current production index is ~3.3 MB.
  const tooLarge="資料庫檔案超過安全大小上限（16 MiB）";
  const declared=Number(response.headers.get("content-length"));
  if(declared>maxBytes)throw new Error(tooLarge);
  if(!response.body)throw new Error("瀏覽器無法驗證資料庫下載大小");
  const reader=response.body.getReader();
  const decoder=new TextDecoder("utf-8",{fatal:true});
  let received=0,payload="";
  try{
    while(true){
      const {done,value}=await reader.read();
      if(done)break;
      received+=value.byteLength;
      if(received>maxBytes){
        await reader.cancel();
        throw new Error(tooLarge);
      }
      payload+=decoder.decode(value,{stream:true});
    }
    payload+=decoder.decode();
  }finally{
    reader.releaseLock();
  }
  return JSON.parse(payload);
}
async function load(){
  // A slower previous request must never overwrite a successful retry.
  const requestId=++loadSequence;
  activeLoadController?.abort();
  ready=false;
  results.setAttribute("aria-busy","true");
  $("#retry").hidden=true;status.textContent="正在讀取教材資料庫……";
  const controller=new AbortController();
  activeLoadController=controller;
  const timeout=setTimeout(()=>controller.abort(),15000);
  try{
    const response=await fetch("search-index.json",{signal:controller.signal,cache:"no-cache",credentials:"omit"});
    if(!response.ok)throw new Error("HTTP "+response.status);
    const data=await readBoundedIndex(response);
    if(requestId!==loadSequence)return;
    if(data?.version!==1||!Array.isArray(data.items))throw new Error("不支援的資料格式");
    // Match the main search index safety ceiling; never process an unbounded payload.
    if(data.items.length>20000)throw new Error("資料庫超過安全筆數上限");
    // Do not silently present a partial production corpus as complete.
    const minRecords=3602;
    if(data.items.length<minRecords)throw new Error("資料庫筆數低於完整基準（至少 "+minRecords+" 筆）");
    const seen=new Set();
    const clean=[];
    for(const item of data.items){
      if(!item||["id","type","subject","title","body","href"].some(key=>typeof item[key]!=="string"))continue;
      // Reject malformed entries atomically, even if 3,602 other records remain.
      if(!/^[a-z]+:[A-Za-z0-9_-]{1,150}$/.test(item.id)
        ||!Object.hasOwn(kindNames,item.type)
        ||!item.title.trim()||item.title.length>1000||item.body.length>100000
        ||seen.has(item.id))continue;
      const href=safeHref(item.href);
      if(!href)continue;
      seen.add(item.id);
      clean.push({...item,href,_title:normalize(item.title),_subject:normalize(label(subjectNames,item.subject)),_body:normalize(item.body)});
    }
    if(clean.length<minRecords)throw new Error("有效資料筆數低於完整基準（至少 "+minRecords+" 筆）");
    // An index with extra malformed/duplicate rows must not be shown as complete.
    // Fail atomically instead of quietly discarding records above the minimum.
    if(clean.length!==data.items.length)throw new Error("資料庫包含無效或重複記錄，已停止載入以避免漏列");
    records=clean;
    ready=true;
    const draft={query:input.value,subject:subject.value,kind:kind.value};
    const restoreDraft=pendingUserEdits;
    subject.replaceChildren(new Option("全部科目", ""));
    kind.replaceChildren(new Option("全部類型", ""));
    fillOptions(subject,new Set(records.map(x=>x.subject||uncategorizedSubject)),{...subjectNames,[uncategorizedSubject]:"小說／未分類"});
    fillOptions(kind,new Set(records.map(x=>x.type)),kindNames);
    const params=new URLSearchParams(location.search);
    page=restoreDraft?0:pageFromUrl(params);
    input.value=restoreDraft?draft.query:(params.get("q")||"").slice(0,200);
    const chosenSubject=restoreDraft?draft.subject:params.get("subject");
    const chosenKind=restoreDraft?draft.kind:params.get("type");
    if([...subject.options].some(x=>x.value===chosenSubject))subject.value=chosenSubject||"";
    if([...kind.options].some(x=>x.value===chosenKind))kind.value=chosenKind||"";
    pendingUserEdits=false;
    search({preservePage:true});
    
  }catch(error){
    // Stop any remaining network transfer after a rejected/oversized payload.
    controller.abort();
    if(requestId!==loadSequence)return;
    ready=false;
    records=[];hits=[];results.replaceChildren();pager.hidden=true;
    status.textContent="資料載入失敗："+(error.name==="AbortError"?"連線逾時":error.message)+"。可重新載入。";
    $("#retry").hidden=false;
  }finally{
    clearTimeout(timeout);
    if(requestId===loadSequence){
      activeLoadController=null;
      results.setAttribute("aria-busy","false");
    }
  }
}
input.addEventListener("input",()=>{if(!ready)pendingUserEdits=true;clearTimeout(timer);timer=setTimeout(search,130)});
subject.addEventListener("change",()=>{if(!ready)pendingUserEdits=true;search()});
kind.addEventListener("change",()=>{if(!ready)pendingUserEdits=true;search()});
function changePage(offset){
  page=Math.max(0,Math.min(page+offset,Math.max(0,Math.ceil(hits.length/pageSize)-1)));
  draw();updateLink();
  const firstHeading=results.querySelector("h2");
  firstHeading?.focus({preventScroll:true});
  firstHeading?.scrollIntoView({block:"start",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"instant":"smooth"});
}
$("#previous").addEventListener("click",()=>changePage(-1));
$("#next").addEventListener("click",()=>changePage(1));
function jumpToPage(){
  const control=$("#page-jump"),target=Number(control.value);
  const maxPage=Math.max(1,Math.ceil(hits.length/pageSize));
  if(!control.value.trim()||!Number.isSafeInteger(target)||target<1||target>maxPage){
    control.value=String(page+1);
    control.setAttribute("aria-invalid","true");
    status.textContent="頁碼超出範圍，請輸入 1 至 "+maxPage+" 頁。";
    control.focus();return;
  }
  control.setAttribute("aria-invalid","false");
  changePage(target-page-1);
}
$("#go-page").addEventListener("click",jumpToPage);
$("#page-jump").addEventListener("keydown",event=>{
  if(event.key==="Enter"){event.preventDefault();jumpToPage();}
});
$("#retry").addEventListener("click",load);
$("#reset").addEventListener("click",()=>{
  input.value="";subject.value="";kind.value="";
  search();input.focus();
});
load();
</script>
</body>
</html>
