<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>法律教材搜尋預覽｜Larry Law Study</title>
<link rel="stylesheet" href="design-system.css">
<style>
body{font-family:system-ui,"Noto Sans TC",sans-serif;max-width:900px;margin:auto;padding:1.5rem;line-height:1.7}
input{width:100%;box-sizing:border-box;padding:.8rem;font:inherit;border:1px solid #777;border-radius:.5rem}
article{border:1px solid #bbb;border-radius:.7rem;padding:1rem;margin:1rem 0}
small{opacity:.8}a{overflow-wrap:anywhere}button{padding:.5rem}#status{min-height:1.5em}
</style></head>
<body><main>
<nav><a href="courses.html">返回課程入口</a></nav>
<h1>法律教材搜尋（預覽版）</h1>
<p>目前索引已確認存在的九個頁面，尚未涵蓋全部教材；搜尋在瀏覽器本機執行，不會上傳查詢內容。</p>
<label for="query">輸入科目、法條或關鍵字</label>
<input id="query" type="search" placeholder="例如：物權 757" autocomplete="off">
<p id="status" role="status" aria-live="polite">正在載入教材索引……</p>
<div id="results"></div>
</main>
<script type="module">
const pages = [
  {url:"index.html",subject:"首頁",label:"網站首頁"},
  {url:"reading.html",subject:"閱讀",label:"閱讀專區"},
  {url:"discover.html",subject:"探索",label:"探索專區"},
  {url:"questions.html",subject:"題庫",label:"練習題庫"},
  {url:"legal-english.html",subject:"法學英文",label:"法學英文"},
  {url:"photonics.html",subject:"跨領域",label:"跨領域筆記"},
  {url:"courses.html",subject:"課程",label:"課程入口"},
  {url:"essentials.html",subject:"筆記",label:"各科筆記"},
  {url:"class-notes/property-midterm-1151.html",subject:"民法物權",label:"物權期中考整理"}
];
const input=document.querySelector("#query"),results=document.querySelector("#results"),status=document.querySelector("#status");
let index=[];
let loading=true;
let failedCount=0;
const normalize=s=>s.normalize("NFKC").toLocaleLowerCase("zh-TW").replace(/\s+/g," ").trim();
const load=async page=>{
  const response=await fetch(page.url,{cache:"no-cache"});
  if(!response.ok)throw new Error(String(response.status));
  const doc=new DOMParser().parseFromString(await response.text(),"text/html");
  doc.querySelectorAll("script,style,nav,footer").forEach(n=>n.remove());
  return {...page,title:doc.title||page.label,body:doc.body?.textContent?.replace(/\s+/g," ").trim()||""};
};
function render(){
  results.replaceChildren();
  const terms=normalize(input.value).split(" ").filter(Boolean);
  if(!terms.length){status.textContent=loading?"正在載入教材索引……":`已索引 ${index.length} 個頁面；輸入關鍵字開始搜尋。${failedCount?` ${failedCount} 個頁面讀取失敗。`:""}`;return;}
  const hits=index.map(page=>{
    const title=normalize(page.title),body=normalize(page.body);
    if(!terms.every(term=>title.includes(term)||body.includes(term)||normalize(page.subject).includes(term)))return null;
    return {...page,score:terms.reduce((sum,term)=>sum+(title.includes(term)?8:0)+(body.includes(term)?1:0),0)};
  }).filter(Boolean).sort((a,b)=>b.score-a.score);
  status.textContent=`找到 ${hits.length} 個符合的頁面（索引範圍：${index.length} 頁）。${loading?" 索引仍在載入中。":""}${failedCount?` ${failedCount} 個頁面讀取失敗。`:""}`;
  for(const hit of hits){
    const card=document.createElement("article"),link=document.createElement("a"),detail=document.createElement("p"),meta=document.createElement("small");
    link.href=hit.url;link.textContent=hit.title;meta.textContent=hit.subject;
    const at=Math.max(0,normalize(hit.body).indexOf(terms[0]));
    detail.textContent=hit.body.slice(Math.max(0,at-45),Math.min(hit.body.length,at+155))+"…";
    card.append(link,meta,detail);results.append(card);
  }
}
Promise.allSettled(pages.map(load)).then(all=>{
  index=all.filter(x=>x.status==="fulfilled").map(x=>x.value);
  failedCount=all.length-index.length;
  loading=false;
  render();
});
input.addEventListener("input",render);
</script></body></html>
