name: Deploy Larry Law Study (verified)
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "larry-law-study-pages"
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: TypeScript and note validation
        run: cd modernization && npm install --no-audit --no-fund && npm test && npm run validate -- examples/notes.sample.json
      - name: Real Chromium search smoke test
        run: cd modernization && npm run test:e2e
      - name: Production index safety
        run: python3 modernization/scripts/audit-production-index.py
      - name: Preview index consistency
        run: |
          python3 modernization/scripts/build-search-index.py
          python3 modernization/scripts/audit-index.py
          python3 modernization/scripts/check-search-index.py
      - name: Site and subject audit
        run: |
          python3 modernization/scripts/audit-site.py site-audit.json
          python3 modernization/scripts/audit-coverage.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
