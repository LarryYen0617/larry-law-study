name: Modernization checks
on:
  push:
    paths:
      - 'modernization/**'
      - '.github/workflows/modernization-checks.yml'
  pull_request:
    paths:
      - 'modernization/**'
      - '.github/workflows/modernization-checks.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd modernization && npm install --no-audit --no-fund && npm test && npm run validate -- examples/notes.sample.json
      - run: python3 modernization/scripts/build-search-index.py
      - run: python3 -c 'import json; d=json.load(open("site/search-index.json")); assert d["schemaVersion"]==1 and len(d["pages"])==9'
