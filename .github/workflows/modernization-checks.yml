name: Modernization checks
on:
  push:
    paths:
      - 'modernization/**'
      - 'site/search-preview.html'
      - 'site/search-preview-index.json'
      - 'site/search-index.json'
      - 'site/**/*.html'
      - '.github/workflows/modernization-checks.yml'
  pull_request:
    paths:
      - 'modernization/**'
      - 'site/search-preview.html'
      - 'site/search-preview-index.json'
      - 'site/search-index.json'
      - 'site/**/*.html'
      - '.github/workflows/modernization-checks.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd modernization && npm install --no-audit --no-fund && npm test && npm run validate -- examples/notes.sample.json
      - run: python3 modernization/test/index-builder.test.py
      - run: python3 modernization/test/site-audit.test.py
      - run: python3 modernization/test/index-audit.test.py
      - run: python3 modernization/test/production-audit.test.py
      - run: python3 modernization/test/search-page.test.py
      - run: python3 modernization/test/coverage-audit.test.py
      - run: python3 modernization/scripts/build-search-index.py
      - run: python3 modernization/scripts/audit-index.py
      - run: python3 modernization/scripts/audit-production-index.py
      - run: python3 modernization/scripts/check-search-index.py

      - run: python3 modernization/scripts/audit-coverage.py
      - run: python3 modernization/scripts/audit-site.py site-audit.json
      - run: node --check modernization/test/legal-search.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: site-audit
          path: |
            site-audit.json
            coverage-report.json
