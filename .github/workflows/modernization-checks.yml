name: Modernization checks
on:
  push:
    paths:
      # Run pre-merge checks for every site, script, test and workflow change.
      - 'site/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'modernization/**'
      - 'site/class-document.*'
      - 'site/review-layer.js'
      - 'tests/review-provenance.cjs'
      - 'tests/test_statute_verification.py'
      - 'scripts/verify_statute_quotes.py'
      - 'scripts/public_learning.py'
      - 'scripts/publish_editorials.py'
      - 'scripts/check_public_learning.py'
      - 'tests/test_public_learning.py'
      - 'tests/test_committed_editorials.py'
      - 'scripts/build_legal_english.py'
      - 'scripts/publish_note_expansions.py'
      - 'site/search-preview.html'
      - 'site/search-preview-index.json'
      - 'site/search-index.json'
      - 'site/**/*.html'
      - 'site/**/*.css'
      - 'site/**/*.js'
      - 'scripts/build_search_index.cjs'
      - 'scripts/build_learning_catalog.py'
      - 'tests/frontend.cjs'
      - 'tests/course-catalog.cjs'
      - 'tests/class-notes.cjs'
      - 'tests/questions.cjs'
      - '.github/workflows/daily.yml'
      - 'tests/search-index-links.cjs'
      - 'site/discover-core.js'
      - 'site/discover.js'
      - 'tests/discover.cjs'
      - 'tests/search-preview.cjs'
      - '.github/workflows/modernization-checks.yml'
  pull_request:
    paths:
      # Run pre-merge checks for every site, script, test and workflow change.
      - 'site/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'modernization/**'
      - 'site/class-document.*'
      - 'site/review-layer.js'
      - 'tests/review-provenance.cjs'
      - 'tests/test_statute_verification.py'
      - 'scripts/verify_statute_quotes.py'
      - 'scripts/public_learning.py'
      - 'scripts/publish_editorials.py'
      - 'scripts/check_public_learning.py'
      - 'tests/test_public_learning.py'
      - 'tests/test_committed_editorials.py'
      - 'scripts/build_legal_english.py'
      - 'scripts/publish_note_expansions.py'
      - 'site/search-preview.html'
      - 'site/search-preview-index.json'
      - 'site/search-index.json'
      - 'site/**/*.html'
      - 'site/**/*.css'
      - 'site/**/*.js'
      - 'scripts/build_search_index.cjs'
      - 'scripts/build_learning_catalog.py'
      - 'tests/frontend.cjs'
      - 'tests/course-catalog.cjs'
      - 'tests/class-notes.cjs'
      - 'tests/questions.cjs'
      - '.github/workflows/daily.yml'
      - 'tests/search-index-links.cjs'
      - 'site/discover-core.js'
      - 'site/discover.js'
      - 'tests/discover.cjs'
      - 'tests/search-preview.cjs'
      - '.github/workflows/modernization-checks.yml'
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd modernization && npm install --no-audit --no-fund && npm test && npm run validate -- examples/notes.sample.json
      - run: node tests/review-provenance.cjs
      - run: node tests/essentials.cjs
      - run: python3 -m unittest discover -s tests -q
      - run: python3 scripts/check_public_learning.py
      - run: node tests/library.cjs
      - run: node tests/frontend.cjs
      - run: node tests/questions.cjs
      - run: node tests/class-notes.cjs
      - run: node tests/discover.cjs
      - run: node tests/search-preview.cjs
      - run: node scripts/build_search_index.cjs
      - run: node tests/course-catalog.cjs
      # Match the mandatory novel integrity gate used before the live Pages release.
      - run: node tests/novel-integrity.cjs
      - run: cd modernization && npm run test:e2e
      - run: python3 modernization/test/index-builder.test.py
      - run: python3 modernization/test/site-audit.test.py
      - run: python3 modernization/test/index-audit.test.py
      - run: python3 modernization/test/production-index-audit.test.py
      - run: python3 modernization/test/production-audit.test.py
      - run: python3 modernization/test/search-page.test.py
      - run: python3 modernization/test/coverage-audit.test.py
      # Preview index is generated in CI; the production index remains read-only.
      - run: python3 modernization/scripts/build-search-index.py
      - run: python3 modernization/scripts/audit-index.py
      - run: python3 modernization/scripts/audit-production-index.py
      - run: node tests/search-index-links.cjs --self-test
      - run: node tests/search-index-links.cjs
      - run: python3 modernization/scripts/check-search-index.py

      - run: python3 modernization/scripts/audit-coverage.py
      - run: python3 modernization/scripts/audit-site.py site-audit.json
      - run: node --check modernization/test/legal-search.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: site-audit
          path: |
            site-audit.json
            coverage-report.json
