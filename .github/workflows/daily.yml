name: 每日九點更新與發布

on:
  schedule:
    - cron: '0 1 * * *' # UTC 01:00 = Asia/Taipei 09:00；GitHub 可能延遲執行
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-pages
  cancel-in-progress: false

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 執行離線測試
        run: python -m unittest discover -s tests -v
      - name: 執行前端互動測試
        run: node tests/frontend.cjs
      - name: 取得 Pages 設定
        id: pages
        uses: actions/configure-pages@v5
      - name: 從官方來源更新公開資料
        run: python scripts/update_daily.py --previous-url '${{ steps.pages.outputs.base_url }}/updates/daily.json'
      - name: 發布已提交的原創導讀與歷史文章（無需 API 金鑰）
        run: python scripts/publish_editorials.py
      - name: 上傳網站（不包含教材原始檔、腳本或任何秘密）
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: 發布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: 若所有消息來源失敗，明確回報（網站仍保留可用內容）
        run: python -c "import json,sys; d=json.load(open('site/updates/daily.json')); print('News status:',d['newsState']); print('Editorial status:',d.get('editorial',{}).get('status')); sys.exit(1 if d['newsState']=='error' or d.get('editorial',{}).get('status') in ('rejected','error','no_sources','not_configured') else 0)"
