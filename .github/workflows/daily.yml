name: 官方資訊更新與網站發布

on:
  schedule:
    - cron: '0 1,5,9,13,17,21 * * *' # 每4小時同步官方資訊，含台北09:00；實際執行可能延遲
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-pages
  cancel-in-progress: true # 最新主站版本取代過期發布；文章原稿已永久提交保存

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      # Keep the release's Node/Playwright runtime identical to PR checks.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 建置法源對照深化筆記
        run: python scripts/publish_note_expansions.py
      - name: 建置全部課程與法學英文
        run: |
          python scripts/build_legal_english.py
          python scripts/build_learning_catalog.py
      - name: 執行離線測試
        run: python -m unittest discover -s tests -v
      - name: 產生題庫校訂資料並驗證內容
        run: python scripts/publish_question_reviews.py
      - name: 建置整合解析筆記
        run: node scripts/build_analysis_notes.cjs
      - name: 驗證題庫答案、計算及原始資料保留
        run: node tests/question-review.cjs
      - name: 執行前端互動測試
        run: |
          node tests/frontend.cjs
          node tests/essentials.cjs
          node tests/review-provenance.cjs
          node tests/class-notes.cjs
          node tests/legal-english.cjs
          node tests/essay-templates.cjs
          node tests/practice.cjs
          node tests/practice-views.cjs
          node tests/questions.cjs
          node tests/daily-entry.cjs
          node tests/note-law.cjs
          node tests/study-workspace.cjs
      - name: 驗證小說章節完整性與字數待辦
        run: node tests/novel-integrity.cjs
      - name: 取得 Pages 設定
        id: pages
        uses: actions/configure-pages@v5
      - name: 從官方來源更新公開資料
        run: python scripts/update_daily.py --previous-url '${{ steps.pages.outputs.base_url }}/updates/daily.json'
      - name: 發布已提交的原創導讀與歷史文章（無需 API 金鑰）
        run: python scripts/publish_editorials.py
      - name: 重建全站搜尋並驗證收藏複習流程
        run: |
          python scripts/prepare_public_teacher_archive.py
          node tests/discover.cjs
          node tests/search-index-links.cjs --self-test
          node tests/search-index-links.cjs
          node tests/course-catalog.cjs
      - name: 升級版搜尋、資料安全及 Chromium 實測
        run: |
          cd modernization
          npm install --no-audit --no-fund
          npm test
          npm run test:e2e
          cd ..
          python3 modernization/scripts/audit-production-index.py
          python3 modernization/scripts/audit-site.py site-audit.json
          python3 modernization/scripts/audit-coverage.py
      - name: 驗證最終網站資料隔離
        run: python3 scripts/check_public_learning.py
      - name: 若所有消息來源失敗，明確回報（網站仍保留可用內容）
        run: python -c "import json,sys; d=json.load(open('site/updates/daily.json')); print('News status:',d['newsState']); print('Editorial status:',d.get('editorial',{}).get('status')); sys.exit(1 if d['newsState']=='error' or d.get('editorial',{}).get('status') in ('rejected','error','no_sources','not_configured') else 0)"
      - name: 上傳網站（不包含教材原始檔、腳本或任何秘密）
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: 發布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
